name: Foundation release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact synchronized version from package.json
        required: true
        type: string
      approval:
        description: Type publish after reviewing the protected environment approval
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: foundation-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: foundation-release
    steps:
      - name: Check out the exact protected source revision
        uses: actions/checkout@v5

      - name: Set up Node.js and npm trusted publishing
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install pinned build dependencies
        run: npm ci

      - name: Assert the approved synchronized version
        env:
          APPROVED_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./package.json');if(p.version!==process.env.APPROVED_VERSION)process.exit(1)"

      - name: Build artifact-derived release metadata
        run: npm run release:prepare

      - name: Verify clean external install, builds, and deployment dry run
        run: npm run release:verify

      - name: Publish and verify the synchronized release
        env:
          FOUNDRY_RELEASE_APPROVED: ${{ inputs.approval }}
          FOUNDRY_RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-foundation-release.mjs
