name: Product CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: product-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-reference-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify generated Site Definition validator
        run: npm run verify:site-validator

      - name: Run application-seam tests with structured evidence
        run: node scripts/run-tests-with-evidence.mjs /tmp/foundry-vitest.json

      - name: Verify MCP conformance evidence from the test run
        run: node scripts/verify-mcp-conformance.mjs /tmp/foundry-vitest.json

      - name: Verify official MCP Inspector compatibility
        run: npm run verify:mcp:inspector

      - name: Install browser acceptance runtime
        run: npx playwright install --with-deps chromium

      - name: Run thin browser acceptance tests
        run: npm run test:browser

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Build optimized Next.js application
        run: npm run build

      - name: Verify public bundle boundary
        run: npm run verify:bundle

      - name: Build Cloudflare Workers artifact
        run: npm run build:worker

      - name: Verify workerd runtime behavior
        run: npm run verify:worker

      - name: Verify public repository integrity
        env:
          GH_TOKEN: ${{ github.token }}
          WAYFINDER_FORBIDDEN_TERMS: ${{ secrets.WAYFINDER_FORBIDDEN_TERMS }}
        run: npm run verify:integrity
