name: Repository integrity

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, transferred]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify Wayfinder and public-product boundaries
        env:
          GH_TOKEN: ${{ github.token }}
          WAYFINDER_FORBIDDEN_TERMS: ${{ secrets.WAYFINDER_FORBIDDEN_TERMS }}
        run: node scripts/verify-repository-integrity.mjs
